name: Publish to NPM

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: npm-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  source-quality:
    name: Validate source on supported tooling
    runs-on: ubuntu-latest

    steps:
      - name: Checkout exact tag revision
        uses: actions/checkout@v4

      - name: Setup supported development toolchain
        uses: actions/setup-node@v4
        with:
          # Vite 7 requires Node 20.19+; use the packaging runtime for all
          # source-level tools while preserving Node 20.0 product support via
          # the exact-candidate runtime matrix below.
          node-version: '24.x'
          cache: npm

      - name: Show toolchain versions
        run: node -v && npm -v

      - name: Install locked dependencies
        run: npm ci

      - name: Run type check
        run: npm run typecheck

      - name: Run lint
        run: npm run lint

      - name: Check source formatting
        run: npm run format:check

      - name: Run nonempty verified tests
        run: npm test

      - name: Build distributable files
        run: npm run build

  package-candidate:
    name: Pack one immutable candidate
    needs: source-quality
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.identity.outputs.version }}
      tarball: ${{ steps.identity.outputs.tarball }}
      sha256: ${{ steps.identity.outputs.sha256 }}

    steps:
      - name: Checkout exact tag revision
        uses: actions/checkout@v4

      - name: Setup packaging runtime
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm

      - name: Install and rebuild exact revision
        run: |
          npm ci
          npm run build

      - name: Verify tag matches package version
        shell: bash
        run: |
          PACKAGE_VERSION=$(npm pkg get version | tr -d '"')
          TAG_VERSION=${GITHUB_REF_NAME#v}
          test "$TAG_VERSION" = "$PACKAGE_VERSION"

      - name: Pack candidate once and record identity
        id: identity
        shell: bash
        run: |
          mkdir -p release-candidate
          PACKAGE_VERSION=$(npm pkg get version | tr -d '"')
          TARBALL=$(npm pack --pack-destination release-candidate --silent)
          SHA256=$(sha256sum "release-candidate/$TARBALL" | cut -d ' ' -f 1)
          printf '%s  %s\n' "$SHA256" "$TARBALL" > release-candidate/candidate.sha256
          node -e 'const fs=require("node:fs"); const [tag,version,tarball,sha,revision]=process.argv.slice(1); fs.writeFileSync("release-candidate/candidate-metadata.json", JSON.stringify({tag,version,tarball,sha256:sha,revision}, null, 2)+"\n", {mode:0o600})' "$GITHUB_REF_NAME" "$PACKAGE_VERSION" "$TARBALL" "$SHA256" "$GITHUB_SHA"
          echo "version=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"

      - name: Preserve checksum-addressed candidate
        uses: actions/upload-artifact@v4
        with:
          name: npm-candidate-${{ steps.identity.outputs.sha256 }}
          path: release-candidate/
          if-no-files-found: error
          retention-days: 7

  runtime-candidate:
    name: Runtime ${{ matrix.node-version }} (${{ matrix.node-sqlite-backup }})
    needs: package-candidate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - node-version: '20.0.0'
            backup-driver: better-sqlite3
            node-sqlite-backup: unavailable
          - node-version: '22.15.1'
            backup-driver: better-sqlite3
            node-sqlite-backup: missing
          - node-version: '22.16.0'
            backup-driver: node:sqlite
            node-sqlite-backup: supported
          - node-version: '23.7.0'
            backup-driver: better-sqlite3
            node-sqlite-backup: missing
          - node-version: '23.8.0'
            backup-driver: node:sqlite
            node-sqlite-backup: supported
          - node-version: '24.x'
            backup-driver: node:sqlite
            node-sqlite-backup: supported
          - node-version: '25.x'
            backup-driver: node:sqlite
            node-sqlite-backup: supported
          - node-version: '26.x'
            backup-driver: node:sqlite
            node-sqlite-backup: supported

    steps:
      - name: Checkout exact tag revision
        uses: actions/checkout@v4

      - name: Setup product runtime
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Show runtime versions
        run: node -v && npm -v

      - name: Download checksum-addressed candidate
        uses: actions/download-artifact@v4
        with:
          name: npm-candidate-${{ needs.package-candidate.outputs.sha256 }}
          path: release-candidate

      - name: Verify candidate checksum and revision
        shell: bash
        working-directory: release-candidate
        run: |
          sha256sum -c candidate.sha256
          ACTUAL_SHA256=$(sha256sum "${{ needs.package-candidate.outputs.tarball }}" | cut -d ' ' -f 1)
          test "$ACTUAL_SHA256" = "${{ needs.package-candidate.outputs.sha256 }}"
          test "$(node -p 'require("./candidate-metadata.json").revision')" = "$GITHUB_SHA"
          test "$(node -p 'require("./candidate-metadata.json").version')" = "${{ needs.package-candidate.outputs.version }}"
          test "$(node -p 'require("./candidate-metadata.json").tag')" = "v${{ needs.package-candidate.outputs.version }}"
          test "$(node -p 'require("./candidate-metadata.json").sha256')" = "${{ needs.package-candidate.outputs.sha256 }}"
          test "$(node -p 'require("./candidate-metadata.json").tarball')" = "${{ needs.package-candidate.outputs.tarball }}"

      - name: Smoke exact candidate and SQLite boundary
        run: >-
          node scripts/smoke-packed-package.mjs
          "release-candidate/${{ needs.package-candidate.outputs.tarball }}"
          --runtime-only
          --expected-backup-driver=${{ matrix.backup-driver }}
          --expected-node-sqlite-backup=${{ matrix.node-sqlite-backup }}

  verify-candidate:
    name: Verify exact packed bytes
    needs: package-candidate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout verification scripts
        uses: actions/checkout@v4

      - name: Setup smoke-test runtime
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: Install declaration-audit toolchain
        run: npm ci

      - name: Download preserved candidate
        uses: actions/download-artifact@v4
        with:
          name: npm-candidate-${{ needs.package-candidate.outputs.sha256 }}
          path: release-candidate

      - name: Verify candidate checksum and metadata
        shell: bash
        working-directory: release-candidate
        run: |
          sha256sum -c candidate.sha256
          ACTUAL_SHA256=$(sha256sum "${{ needs.package-candidate.outputs.tarball }}" | cut -d ' ' -f 1)
          test "$ACTUAL_SHA256" = "${{ needs.package-candidate.outputs.sha256 }}"
          test "$(node -p 'require("./candidate-metadata.json").revision')" = "$GITHUB_SHA"
          test "$(node -p 'require("./candidate-metadata.json").version')" = "${{ needs.package-candidate.outputs.version }}"
          test "$(node -p 'require("./candidate-metadata.json").tag')" = "v${{ needs.package-candidate.outputs.version }}"
          test "$(node -p 'require("./candidate-metadata.json").sha256')" = "${{ needs.package-candidate.outputs.sha256 }}"
          test "$(node -p 'require("./candidate-metadata.json").tarball')" = "${{ needs.package-candidate.outputs.tarball }}"

      - name: Clean-install and smoke exact package
        run: node scripts/smoke-packed-package.mjs "release-candidate/${{ needs.package-candidate.outputs.tarball }}"

  publish:
    name: Publish preserved candidate
    needs: [package-candidate, verify-candidate, runtime-candidate]
    runs-on: ubuntu-latest
    environment: npm-release-verification
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Setup npm trusted publishing
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Download the approved candidate
        uses: actions/download-artifact@v4
        with:
          name: npm-candidate-${{ needs.package-candidate.outputs.sha256 }}
          path: release-candidate

      - name: Recheck preserved checksum and identity
        shell: bash
        working-directory: release-candidate
        run: |
          sha256sum -c candidate.sha256
          ACTUAL_SHA256=$(sha256sum "${{ needs.package-candidate.outputs.tarball }}" | cut -d ' ' -f 1)
          test "$ACTUAL_SHA256" = "${{ needs.package-candidate.outputs.sha256 }}"
          test "$(node -p 'require("./candidate-metadata.json").revision')" = "$GITHUB_SHA"
          test "$(node -p 'require("./candidate-metadata.json").version')" = "${{ needs.package-candidate.outputs.version }}"
          test "$(node -p 'require("./candidate-metadata.json").tag')" = "v${{ needs.package-candidate.outputs.version }}"
          test "$(node -p 'require("./candidate-metadata.json").sha256')" = "${{ needs.package-candidate.outputs.sha256 }}"
          test "$(node -p 'require("./candidate-metadata.json").tarball')" = "${{ needs.package-candidate.outputs.tarball }}"

      - name: Remove token-based npm configuration
        run: npm config delete //registry.npmjs.org/:_authToken

      - name: Publish the exact verified tarball without rebuilding
        run: npm publish "release-candidate/${{ needs.package-candidate.outputs.tarball }}" --provenance --access public
        env:
          NODE_AUTH_TOKEN: ''
          NPM_TOKEN: ''
